    <style>
      html, body { margin: 0; height: 100%; background: #050409; overflow: hidden; }
      /* loading: a dark frame and one slow pulse of light where the dancers will stand; then the dancers fade up */
      #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; opacity: 0; transition: opacity 1.6s cubic-bezier(0.55, 0, 0.6, 1); }
      body.ready #stage { opacity: 1; }
      body::before { content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 1;
        background: radial-gradient(ellipse 13vmin 24vmin at 50% 57%, rgba(255, 196, 150, 0.2), rgba(150, 120, 255, 0.07) 55%, transparent 100%);
        animation: eb-pulse 3.2s ease-in-out infinite; transition: opacity 0.9s; }
      body.ready::before { opacity: 0; animation: none; }
      @keyframes eb-pulse { 0%, 100% { opacity: 0.15; transform: scale(0.94); } 50% { opacity: 1; transform: scale(1.04); } }
      /* the status line only ever speaks to say WebGPU is missing (main.ts) */
      #status { position: fixed; left: 16px; bottom: 12px; margin: 0; color: #8a8294; font: 13px system-ui, sans-serif; max-width: calc(100vw - 32px); z-index: 2; }
      #status:empty { display: none; }

      /* the HUD (src/hud): two 2D canvases over the stage, sized to it by the HUD; under the menus and the touch pad, never
         taking a pointer. Shown only while a mode draws it (a duel; ?hud=demo; the jogo's beat behind ?hud=beat) */
      .hud { position: fixed; left: 0; top: 0; z-index: 3; pointer-events: none; display: none; }
      body:not(.ready) .hud { opacity: 0; }

      /* jogo (src/play/menu.ts): the front of the game, the lobby, the room's code. Icons and short labels only */
      .jg { position: fixed; z-index: 5; color: #ece6f4; font: 500 12px/1.2 system-ui, sans-serif; letter-spacing: 0.04em; user-select: none; -webkit-user-select: none; transition: opacity 0.6s; }
      body:not(.ready) .jg { opacity: 0; transition: none; }
      .jg.gone, .jg.dim { opacity: 0; pointer-events: none; }
      .jg [hidden] { display: none !important; }
      .jg svg { width: 100%; height: 100%; display: block; }
      .jg-row { display: flex; gap: 10px; align-items: center; justify-content: center; flex-wrap: wrap; }
      .jg-btn { appearance: none; border: 0; background: none; color: inherit; font: inherit; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 5px;
        padding: 6px; border-radius: 14px; opacity: 0.55; transition: opacity 0.2s, background 0.2s, transform 0.2s; -webkit-tap-highlight-color: transparent; }
      .jg-btn:hover, .jg-btn:focus-visible { opacity: 0.9; outline: none; background: rgba(255, 255, 255, 0.06); }
      .jg-btn.on { opacity: 1; background: rgba(255, 255, 255, 0.1); }
      .jg-btn span { font-size: 11px; text-transform: lowercase; }
      .jg-seat { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; font-size: 10px; background: rgba(255, 255, 255, 0.12); }
      .jg-world i { display: block; width: 26px; height: 26px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff8, var(--c) 45%, #0008 100%); box-shadow: 0 0 14px var(--c); }
      .jg-swatch i { display: block; width: 22px; height: 22px; border-radius: 50%; background: linear-gradient(135deg, var(--a), var(--b), var(--a)); background-size: 300% 300%;
        animation: jg-live 3.2s ease-in-out infinite alternate; box-shadow: 0 0 10px var(--a); }
      @keyframes jg-live { from { background-position: 0% 50%; } to { background-position: 100% 50%; } }
      .jg-body.one + .jg-body, .jg-bodies.one .jg-body:last-child { display: none; }
      .jg-code { width: 74px; padding: 8px 10px; border-radius: 10px; border: 1px solid rgba(255, 255, 255, 0.18); background: rgba(0, 0, 0, 0.3); color: inherit;
        font: 600 16px/1 ui-monospace, monospace; letter-spacing: 0.2em; text-align: center; text-transform: uppercase; }
      .jg-online .jg-btn svg { width: 30px; height: 30px; }

      /* the front: a low glass strip in the lower third, never over the dancers. One unit (--u) scales it from a phone
         to a 4K screen; the labels are tiny and show only for what is chosen (or pointed at) */
      .jg-front { --u: clamp(11px, 0.68vw, 22px); left: 50%; bottom: max(calc(var(--u) * 1.6), env(safe-area-inset-bottom)); transform: translateX(-50%);
        display: grid; grid-template-areas: "games modes worlds bodies foot" "online online online online online" "net net net net net"; align-items: center; column-gap: calc(var(--u) * 1.6); row-gap: calc(var(--u) * 0.6);
        padding: calc(var(--u) * 0.7) calc(var(--u) * 1.4) calc(var(--u) * 1.15); border-radius: calc(var(--u) * 1.6); max-width: calc(100vw - 24px); box-sizing: border-box;
        background: rgba(12, 9, 20, 0.34); border: 1px solid rgba(255, 255, 255, 0.07); backdrop-filter: blur(14px) saturate(1.2); -webkit-backdrop-filter: blur(14px) saturate(1.2);
        font-size: var(--u); transition: opacity 0.6s, transform 0.6s; }
      .jg-front.idle { opacity: 0.0; transition: opacity 1.6s ease-in, transform 1.6s; transform: translateX(-50%) translateY(6px); }
      .jg-front.dim { transform: translateX(-50%) translateY(12px); }
      .jg-front .jg-row { gap: calc(var(--u) * 0.35); flex-wrap: nowrap; }
      .jg-front .jg-btn { position: relative; padding: calc(var(--u) * 0.35); border-radius: calc(var(--u) * 0.8); gap: 0; }
      .jg-front .jg-btn span { position: absolute; left: 50%; top: 100%; transform: translate(-50%, 1px); font-size: calc(var(--u) * 0.72); line-height: 1; white-space: nowrap;
        opacity: 0; transition: opacity 0.2s; pointer-events: none; color: #d9d2e4; }
      .jg-front .jg-btn.on span, .jg-front .jg-btn:hover span, .jg-front .jg-btn:focus-visible span { opacity: 0.8; }
      /* the game: the dance or the duel, a hairline after it */
      .jg-front .jg-games { grid-area: games; padding-right: calc(var(--u) * 1.1); margin-right: calc(var(--u) * -0.5); border-right: 1px solid rgba(255, 255, 255, 0.1); }
      .jg-front .jg-game svg { width: calc(var(--u) * 2.3); height: calc(var(--u) * 2.3); }
      .jg-front .jg-game.on { color: #ffe2ad; }
      .jg-front .jg-modes { grid-area: modes; }
      .jg-front .jg-worlds { grid-area: worlds; }
      .jg-front .jg-bodies { grid-area: bodies; display: flex; flex-direction: column; gap: calc(var(--u) * 0.25); }
      .jg-front .jg-online { grid-area: online; }
      .jg-front .jg-foot { grid-area: foot; gap: calc(var(--u) * 0.8); }
      .jg-front .jg-mode svg { width: calc(var(--u) * 2.3); height: calc(var(--u) * 2.3); }
      .jg-front .jg-world i { width: calc(var(--u) * 1.5); height: calc(var(--u) * 1.5); box-shadow: 0 0 calc(var(--u) * 0.7) var(--c); }
      .jg-front .jg-body { gap: calc(var(--u) * 0.1); }
      .jg-front .jg-seat { width: calc(var(--u) * 1.3); height: calc(var(--u) * 1.3); font-size: calc(var(--u) * 0.75); margin-right: calc(var(--u) * 0.3); background: rgba(255, 255, 255, 0.08); }
      .jg-front .jg-swatch { padding: calc(var(--u) * 0.22); }
      .jg-front .jg-swatch i { width: calc(var(--u) * 1.3); height: calc(var(--u) * 1.3); box-shadow: 0 0 calc(var(--u) * 0.5) var(--a); }
      .jg-front .jg-swatch.on i { box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.75), 0 0 calc(var(--u) * 0.9) var(--a); }
      .jg-front .jg-swatch span { display: none; }
      .jg-front .jg-lock svg, .jg-front .jg-help svg { width: calc(var(--u) * 1.8); height: calc(var(--u) * 1.8); }
      .jg-front .jg-help { opacity: 0.4; }
      /* the duel online: its room's code (a word and two digits), a new one, the link, copy; a friend's code and join */
      .jg-front .jg-duelnet { grid-area: net; gap: calc(var(--u) * 0.7); padding-top: calc(var(--u) * 0.5); border-top: 1px solid rgba(255, 255, 255, 0.07); }
      .jg-front .jg-duelnet .jg-btn svg { width: calc(var(--u) * 1.7); height: calc(var(--u) * 1.7); }
      .jg-room { font: 650 calc(var(--u) * 1.35)/1 ui-monospace, "Cascadia Mono", Menlo, monospace; letter-spacing: 0.16em; color: #ffe2ad; padding: calc(var(--u) * 0.45) calc(var(--u) * 0.7);
        border-radius: calc(var(--u) * 0.7); background: rgba(255, 214, 138, 0.08); border: 1px solid rgba(255, 214, 138, 0.22); user-select: all; -webkit-user-select: all; }
      .jg-url { font-size: calc(var(--u) * 0.78); opacity: 0.6; max-width: calc(var(--u) * 19); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .jg-front .jg-copy.on { color: #ffe2ad; }
      .jg-front .jg-duelnet .jg-code { width: calc(var(--u) * 5.6); padding: calc(var(--u) * 0.45) calc(var(--u) * 0.5); font-size: calc(var(--u) * 1.05); margin-left: calc(var(--u) * 0.9); }
      .jg-clip { position: fixed; left: -9999px; top: 0; opacity: 0; }
      /* the veil: a short dark fade while a game changes world (front.ts), so no frame of the old stage shows */
      .jg-veil { position: fixed; inset: 0; z-index: 4; pointer-events: none; background: #050409; opacity: 0; transition: opacity 0.36s ease-in; }
      .jg-veil.on { opacity: 1; }
      .jg-veil:not(.on) { transition: opacity 0.8s ease-out; }
      /* the one clear action: play, warm, breathing slowly */
      .jg-front .jg-go { opacity: 1; width: calc(var(--u) * 4); height: calc(var(--u) * 4); border-radius: 50%; display: grid; place-items: center; padding: 0;
        color: #ffd68a; background: radial-gradient(circle, rgba(255, 190, 110, 0.22), rgba(255, 150, 80, 0.06) 70%); box-shadow: 0 0 calc(var(--u) * 1.4) rgba(255, 170, 90, 0.35);
        animation: jg-breath 3.4s ease-in-out infinite; }
      .jg-front .jg-go svg { width: 46% !important; height: 46% !important; margin-left: 8%; }
      .jg-front .jg-go:hover, .jg-front .jg-go:focus-visible { background: radial-gradient(circle, rgba(255, 200, 120, 0.36), rgba(255, 150, 80, 0.1) 70%); }
      @keyframes jg-breath { 50% { box-shadow: 0 0 calc(var(--u) * 2.4) rgba(255, 170, 90, 0.6); } }
      /* tall and narrow (a phone held upright): the strip stacks, play beside the modes */
      @media (max-aspect-ratio: 1/1), (max-width: 720px) {
        .jg-front { --u: clamp(11px, 3vw, 17px); grid-template-areas: "games modes foot" "worlds worlds worlds" "bodies bodies bodies" "online online online" "net net net"; column-gap: calc(var(--u) * 0.9); row-gap: calc(var(--u) * 0.9);
          justify-items: center; width: max-content; padding-left: calc(var(--u) * 1); padding-right: calc(var(--u) * 1); }
        .jg-front .jg-mode svg, .jg-front .jg-game svg { width: calc(var(--u) * 1.8); height: calc(var(--u) * 1.8); }
        .jg-front .jg-games { padding-right: calc(var(--u) * 0.7); margin-right: 0; }
        .jg-front .jg-foot { gap: calc(var(--u) * 0.4); }
        .jg-front .jg-lock svg, .jg-front .jg-help svg { width: calc(var(--u) * 1.5); height: calc(var(--u) * 1.5); }
        .jg-front .jg-duelnet { flex-wrap: wrap; max-width: calc(100vw - 48px); row-gap: calc(var(--u) * 0.8); }
        .jg-url { max-width: calc(var(--u) * 13); }
        .jg-front .jg-go { width: calc(var(--u) * 3.4); height: calc(var(--u) * 3.4); }
      }

      /* short and wide (a phone on its side): the strip smaller and lower, so the dancers stand clear of it */
      @media (max-height: 520px) and (min-aspect-ratio: 1/1) {
        .jg-front { --u: clamp(8px, 2.3vh, 12px); bottom: max(6px, env(safe-area-inset-bottom)); padding: calc(var(--u) * 0.5) calc(var(--u) * 1.1) calc(var(--u) * 0.9); }
      }

      /* the lobby and the room's code: low, beside the dancers, never across them */
      .jg-lobby { left: 50%; bottom: max(28px, env(safe-area-inset-bottom)); transform: translateX(-50%); display: flex; gap: 18px; }
      .jg-card { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 12px 16px; border-radius: 18px; background: rgba(12, 9, 20, 0.34);
        border: 1px solid rgba(255, 255, 255, 0.07); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); opacity: 0.6; transition: opacity 0.3s; }
      .jg-card.on { opacity: 1; }
      .jg-card:not(.on) { cursor: pointer; opacity: 0.85; border-color: rgba(255, 255, 255, 0.22); }
      .jg-card:not(.on):hover { background: rgba(40, 30, 60, 0.5); }
      .jg-card .jg-hint { font-size: 11px; letter-spacing: 0.04em; opacity: 0.75; white-space: nowrap; }
      .jg-card .jg-dev { width: 44px; height: 44px; }
      .jg-card:not(.on) .jg-dev { animation: jg-breathe 1.6s ease-in-out infinite; }
      @keyframes jg-breathe { 50% { transform: scale(0.9); opacity: 0.6; } }
      .jg-waiting { right: 18px; top: 18px; display: flex; gap: 10px; align-items: center; padding: 8px 12px; border-radius: 16px; background: rgba(10, 8, 18, 0.5); }
      .jg-waiting .jg-dev { width: 26px; height: 26px; animation: jg-breathe 1.6s ease-in-out infinite; }
      .jg-share { flex-direction: row; opacity: 0.9; } .jg-share svg { width: 22px; height: 22px; } .jg-share span { font: 600 15px ui-monospace, monospace; letter-spacing: 0.2em; text-transform: none; }
      /* a waiting seat's second way (the duel's "or a partner": a virtual player takes it) */
      .jg-alt { appearance: none; border: 0; background: rgba(255, 255, 255, 0.06); color: inherit; font: inherit; cursor: pointer; display: flex; align-items: center; gap: 6px;
        padding: 4px 10px 4px 6px; border-radius: 12px; opacity: 0.7; font-size: 11px; }
      .jg-alt:hover, .jg-alt:focus-visible { opacity: 1; outline: none; background: rgba(255, 255, 255, 0.12); }
      .jg-alt svg { width: 20px; height: 20px; }
      .jg-card.on .jg-alt { display: none; }
      /* the duel's lobby sits a little higher: the HUD's beat is at the bottom centre */
      .jg-lobby-duel { bottom: max(calc(19vh + 10px), env(safe-area-inset-bottom)); }
      @media (max-width: 759px), (max-height: 479px) { .jg-lobby-duel { bottom: auto; top: 30vh; gap: 10px; } .jg-lobby-duel .jg-card { padding: 10px 12px; } }

      /* the duel's controls card (src/duel/help.ts): the HUD's glass, the keys in its gold */
      .dh { position: fixed; inset: 0; z-index: 8; display: grid; place-items: center; background: rgba(5, 4, 9, 0.35); opacity: 0; transition: opacity 0.22s; color: #ece6f4;
        font: 500 13px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; letter-spacing: 0.02em; user-select: none; -webkit-user-select: none; }
      .dh.in { opacity: 1; }
      .dh-card { width: min(560px, calc(100vw - 32px)); max-height: calc(100vh - 32px); overflow: auto; box-sizing: border-box; padding: 14px 18px 16px; border-radius: 18px;
        background: linear-gradient(rgba(22, 17, 36, 0.86), rgba(12, 9, 20, 0.9)); border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 10px 40px rgba(0, 0, 0, 0.45);
        backdrop-filter: blur(14px) saturate(1.2); -webkit-backdrop-filter: blur(14px) saturate(1.2); transform: translateY(6px); transition: transform 0.22s; }
      .dh.in .dh-card { transform: none; }
      .dh-head { display: flex; justify-content: space-between; align-items: center; font-weight: 650; letter-spacing: 0.08em; text-transform: uppercase; font-size: 11px; color: #ffd68a; }
      .dh-close { appearance: none; border: 0; background: none; color: inherit; font: 400 22px/1 system-ui; cursor: pointer; opacity: 0.7; padding: 0 4px; }
      .dh-tabs { display: flex; gap: 4px; flex-wrap: wrap; margin: 10px 0 8px; }
      .dh-tab { appearance: none; border: 1px solid rgba(255, 255, 255, 0.1); background: none; color: inherit; font: inherit; font-size: 12px; padding: 5px 10px; border-radius: 12px; cursor: pointer; opacity: 0.65; }
      .dh-tab.on { opacity: 1; background: rgba(255, 255, 255, 0.1); border-color: rgba(255, 214, 138, 0.35); }
      .dh-tab:focus-visible, .dh-close:focus-visible { outline: 1px solid rgba(255, 214, 138, 0.6); }
      .dh-page[hidden] { display: none; }
      .dh-keys { width: 100%; border-collapse: collapse; }
      .dh-keys td, .dh-keys th { padding: 3px 4px; vertical-align: middle; }
      .dh-keys th { font-weight: 500; font-size: 11px; opacity: 0.6; text-align: left; }
      .dh-keys td:first-child { opacity: 0.82; }
      .dh-keys td + td { white-space: nowrap; width: 1%; padding-left: 14px; }
      .dh kbd, .dl kbd { display: inline-block; min-width: 1.2em; text-align: center; padding: 1px 7px; border-radius: 6px; border: 1px solid rgba(255, 214, 138, 0.35);
        background: rgba(255, 214, 138, 0.08); color: #ffe2ad; font: 650 12px/1.5 system-ui, sans-serif; letter-spacing: 0.03em; }
      .dh small kbd { opacity: 0.7; font-weight: 500; }
      .dh-powers { display: grid; gap: 6px; margin-top: 10px; padding-top: 10px; border-top: 1px solid rgba(255, 255, 255, 0.08); font-size: 12px; }
      .dh-powers > div { display: grid; grid-template-columns: 60px 1fr; row-gap: 2px; }
      .dh-powers b { grid-row: span 2; font-weight: 650; text-transform: lowercase; opacity: 0.9; }
      .dh-powers span { opacity: 0.85; }
      .dh-powers i { font-style: normal; display: inline-grid; place-items: center; width: 15px; height: 15px; border-radius: 50%; margin-right: 4px; font-size: 10px; background: rgba(255, 255, 255, 0.1); }
      .dh-note { margin: 10px 0 0; font-size: 12px; opacity: 0.6; }
      .dh-chip { --hu: clamp(0.8px, min(calc(100vw / 1280), calc(100vh / 720)), 2.4px); position: fixed; z-index: 4; right: calc(var(--hu) * 22); bottom: calc(var(--hu) * 22); width: 26px; height: 26px; border-radius: 50%;
        appearance: none; border: 1px solid rgba(255, 255, 255, 0.18); background: rgba(16, 12, 26, 0.5); color: #ece6f4; font: 650 13px/1 system-ui, sans-serif; cursor: pointer; opacity: 0.45; padding: 0; }
      .dh-chip:hover, .dh-chip:focus-visible { opacity: 0.9; outline: none; }
      @media (max-width: 759px), (max-height: 479px) { .dh-chip { --cu: clamp(0.78px, calc(min(100vw, 100vh) / 390), 1.3px); right: auto; bottom: auto; left: 50%; transform: translateX(-50%); top: calc(var(--cu) * 68); width: 22px; height: 22px; font-size: 12px; } }

      /* the first duel's lesson (src/duel/lesson.ts): one calm prompt in the lower left corner, clear of the bodies the
         camera frames in the middle and of the beat (on a small screen, under the panels), its keys in the HUD's gold,
         a dot per step, skip */
      .dl { --hu: clamp(0.8px, min(calc(100vw / 1280), calc(100vh / 720)), 2.4px); position: fixed; z-index: 4; left: calc(var(--hu) * 20); bottom: calc(var(--hu) * 20); transform: translate(0, 8px);
        max-width: min(calc(var(--hu) * 400), calc(50vw - var(--hu) * 80)); box-sizing: border-box;
        padding: 10px 46px 12px 16px; border-radius: 16px; color: #ece6f4; font: 500 calc(var(--hu) * 15)/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; letter-spacing: 0.02em; text-align: left;
